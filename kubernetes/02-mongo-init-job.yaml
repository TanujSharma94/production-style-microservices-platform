apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: ecommerce
spec:
  backoffLimit: 6
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command:
            - /bin/bash
            - -c
            - |
              HOST=mongo-0.mongo.ecommerce.svc.cluster.local:27017
              until mongosh --host "$HOST" --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                echo "waiting for mongo..."; sleep 2
              done
              mongosh --host "$HOST" --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'$HOST'}]}) }"
              until mongosh --host "$HOST" --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do
                echo "waiting for primary..."; sleep 2
              done
              echo "replica set ready"
