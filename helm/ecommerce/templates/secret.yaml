apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (pass it with --set secrets.jwtSecret=...)" .Values.secrets.jwtSecret | quote }}
  JWT_EXPIRES_IN: {{ .Values.backend.jwtExpiresIn | quote }}
