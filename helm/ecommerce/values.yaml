# NOTE: service names (backend, frontend, mongo, nginx) are fixed on purpose.
# The NGINX image has "backend:5000" and "frontend:3000" baked into its config.

imagePullPolicy: IfNotPresent

mongo:
  image: mongo:7
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

backend:
  image:
    repository: ecommerce-backend
    tag: "1.0.0"
  replicas: 2
  port: 5000
  database: microservices_platform
  jwtExpiresIn: "7d"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

frontend:
  image:
    repository: ecommerce-frontend
    tag: "1.0.0"
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi

nginx:
  image:
    repository: ecommerce-nginx
    tag: "1.0.1"
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# Edge routing: Ingress -> nginx (gateway) -> frontend / backend
ingress:
  enabled: true
  className: nginx
  host: ""            # empty = match any host (works with localhost)
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"

# Never commit a real value here. Pass it at install time:
#   --set secrets.jwtSecret="..."
secrets:
  jwtSecret: ""
