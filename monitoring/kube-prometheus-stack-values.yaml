# Lean setup for a small minikube node (2.5GB RAM)

alertmanager:
  enabled: false

# node-exporter is unreliable on minikube-in-Docker/WSL; container metrics come from cAdvisor
nodeExporter:
  enabled: false

# These control-plane components are not scrapeable on minikube and would only produce false alerts
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

grafana:
  enabled: true
  defaultDashboardsTimezone: browser
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 100Mi

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    # pick up ServiceMonitors / PrometheusRules from any namespace without a special label
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 600Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
