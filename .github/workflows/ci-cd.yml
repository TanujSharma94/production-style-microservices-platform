name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default token is read-only. Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: find . -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Dependency audit (production only, informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit (production only, informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  helm:
    name: Helm chart checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint chart
        run: helm lint helm/ecommerce --set secrets.jwtSecret=ci-dummy
      - name: Render chart
        run: helm template ecommerce helm/ecommerce --namespace ecommerce --set secrets.jwtSecret=ci-dummy > /dev/null
      - name: Chart must refuse to render without a JWT secret
        run: |
          if helm template ecommerce helm/ecommerce > /dev/null 2>&1; then
            echo "Chart rendered without secrets.jwtSecret"
            exit 1
          fi

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate compose file
        run: JWT_SECRET=ci-dummy docker compose config --quiet
      - name: Build backend image
        run: docker build -t ecommerce-backend:ci backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -t ecommerce-frontend:ci frontend
      - name: Build nginx image and test its config
        run: |
          docker build -t ecommerce-nginx:ci docker/nginx
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 ecommerce-nginx:ci nginx -t

  publish:
    name: Publish images to GHCR
    needs: [backend, frontend, helm, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push images
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA_TAG="${GITHUB_SHA::12}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          for item in "backend:backend" "frontend:frontend" "nginx:docker/nginx"; do
            name="${item%%:*}"
            context="${item#*:}"
            image="ghcr.io/${OWNER}/ecommerce-${name}"
            build_args=()
            if [ "$name" = "frontend" ]; then
              build_args+=(--build-arg "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}")
            fi
            docker build "${build_args[@]}" \
              --label "org.opencontainers.image.source=${REPO_URL}" \
              -t "${image}:${SHA_TAG}" -t "${image}:latest" "$context"
            docker push "${image}:${SHA_TAG}"
            docker push "${image}:latest"
          done
      - name: Summary
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "### Published images"
            echo "- ghcr.io/${OWNER}/ecommerce-backend:${GITHUB_SHA::12}"
            echo "- ghcr.io/${OWNER}/ecommerce-frontend:${GITHUB_SHA::12}"
            echo "- ghcr.io/${OWNER}/ecommerce-nginx:${GITHUB_SHA::12}"
          } >> "$GITHUB_STEP_SUMMARY"
